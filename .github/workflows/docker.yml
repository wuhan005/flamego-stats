name: Docker
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example, v0.1.0); leave empty to build the selected ref'
        required: false
        type: string

env:
  VERSION: ${{ github.event.release.tag_name || inputs.tag || '' }}
  # Pre-releases do not move the latest tag.
  LATEST: ${{ !github.event.release.prerelease }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate release tag
        if: env.VERSION != ''
        run: |
          if [[ ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Release tag must be a valid Docker image tag."
            exit 1
          fi

      # GHCR requires the image name in lowercase.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Checkout code
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.VERSION && format('refs/tags/{0}', env.VERSION) || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            BUILD_COMMIT=${{ steps.checkout.outputs.commit }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=flamego-stats
          cache-to: type=gha,scope=flamego-stats,mode=max
          tags: |
            ${{ env.LATEST == 'true' && format('{0}:latest', env.IMAGE) || '' }}
            ${{ env.IMAGE }}:sha-${{ steps.checkout.outputs.commit }}
            ${{ env.VERSION && format('{0}:{1}', env.IMAGE, env.VERSION) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.checkout.outputs.commit }}
            org.opencontainers.image.version=${{ env.VERSION }}
