<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Who is using Flamego? Statistics of the open-source repositories depending on github.com/flamego/flamego." />
    <title>Flamego Stats</title>
  </head>
  <body>
    <script>
      // Applies the theme and language before the first paint to avoid a flash, keep it in sync with src/composables/useTheme.ts and src/i18n/index.ts.
      try {
        var mode = localStorage.getItem('flamego-stats.theme') || 'system'
        if (mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
        var lang = localStorage.getItem('flamego-stats.lang')
        if (lang === 'en' || lang === 'zh-CN') {
          document.documentElement.lang = lang
        }
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
