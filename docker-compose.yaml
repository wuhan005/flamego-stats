services:
  server:
    image: ghcr.io/wuhan005/flamego-stats:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config/flamego-stats.yaml:/home/app/config/flamego-stats.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ghcr.io/wuhan005/flamego-stats:latest
    entrypoint: ["/home/app/flamego-stats-worker"]
    restart: unless-stopped
    volumes:
      - ./config/flamego-stats.yaml:/home/app/config/flamego-stats.yaml:ro
    depends_on:
      server:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: flamego_stats
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d flamego_stats"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
